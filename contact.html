<h2>Customer Registration & Order Form</h2>
<form>
  <h3>Customer Information</h3>
  <label for="fullname">Full Name</label>
<br>
  <input type="text" id="fullname" name="fullname">
<br><br>

  <label for="email">Email Address</label>
  <br>
  <input type="email" id="email" name="email">
  <br><br>

  <label for="password">Password</label>
  <br>
  <input type="password" id="password" name="password">
  <br><br>

  <label for="phone">Phone Number</label>
  <br>
  <input type="tel" id="phone" name="phone">
  <br><br>

  <h3>Order Information</h3>
  <label for="Quantity">Quantity</label>
  <br>
  <input
  type="number"
  id="quantity"
  name="quantity">
  <br><br>

  <label for="deliveryDate">Preferred Delivery Date</label>
  <br>
  <input
  type="date"
  id="deliveryDate"
  name="deliveryDate">
  <br><br>

  <label for="food">Select Food Item</label>
  <br>
  <select id="food"
  name="food">

  <option>
    Veg Pizza
  </option>
  <option>
    Cheese Burger
  </option>
  <option>
    Pasta
  </option>
  <option>
    Grilled sandwich
  </option>
  <option>
    Chocolate Brownie
  </option>
  </select>
  <br><br>

  <h3>Payment Method</h3>

  <input type="radio" id="cash" name="payment">
  <label for="cash">Cash</label>
  <br>

  <input type="radio" id="card" name="payment">
  <label for="card">Card</label>
  <br>

  <input type="radio" id="upi" name="payment">
  <label for="upi">UPI</label>
  <br><br>

  <h3>Extras</h3>
  <input type="checkbox" id="chesse" name="extras">
  <label for="cheese">Extra Chesse</label>
  <br>

  <input type="checkbox" id="drink" name="extras">
  <label for="drink">Cold Drink</label>
  <br>

  <input type="checkbox" id="dessert" name="extras">
  <label for="dessert">Dessert</label>
  <br><br>

  <h3>Delivery Instruction</h3>
  <label for="Address">
    Delivery Address
  </label>
  <br>
  <textarea id="address" name="address" rows="5" cols="40">
  </textarea>
  <br><br>

  <input type="submit" value="Place Order">
  <input type="reset" value="Clear Form">
</form>
